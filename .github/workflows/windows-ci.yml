name: Windows CI

on:
  push:
    branches:
      - main
      - codex/cgx1-completeness
  pull_request:
    branches:
      - main
      - codex/cgx1-completeness
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run repository validation
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\validate_windows.ps1
